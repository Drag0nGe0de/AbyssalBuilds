name: Rust build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the binaries are for (e.g. v13.0.0-rust.1)"
        required: true
      branch:
        description: "Branch of the source repository to build"
        required: false
        default: "TxLauncher"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Clone the private source
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${{ secrets.SRC_TOKEN }}@github.com/${{ secrets.SRC_REPO }}.git" source
          cd source
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Add Apple targets
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (arm64)
        shell: bash
        working-directory: source
        run: |
          cargo build --release --target aarch64-apple-darwin

      - name: Build (x86_64)
        shell: bash
        working-directory: source
        run: |
          cargo build --release --target x86_64-apple-darwin

      - name: Merge into a universal binary
        shell: bash
        working-directory: source
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/abyssallauncher \
            target/x86_64-apple-darwin/release/abyssallauncher \
            -output abyssallauncher
          lipo -info abyssallauncher

      - name: Bundle the app
        shell: bash
        working-directory: source
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p "Abyssal Launcher.app/Contents/MacOS" "Abyssal Launcher.app/Contents/Resources"
          cp abyssallauncher "Abyssal Launcher.app/Contents/MacOS/abyssallauncher"
          cp program_info/abyssallauncher.icns "Abyssal Launcher.app/Contents/Resources/abyssallauncher.icns"
          cat > "Abyssal Launcher.app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Abyssal Launcher</string>
            <key>CFBundleDisplayName</key><string>Abyssal Launcher</string>
            <key>CFBundleIdentifier</key><string>org.abyssallauncher.AbyssalLauncher</string>
            <key>CFBundleExecutable</key><string>abyssallauncher</string>
            <key>CFBundleIconFile</key><string>abyssallauncher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - "Abyssal Launcher.app"

      - name: Package the dmg
        shell: bash
        working-directory: source
        run: |
          TAG="${{ inputs.tag }}"
          OUT="AbyssalLauncher-Rust-${TAG}-macOS-universal.dmg"
          hdiutil create -volname "Abyssal Launcher" -srcfolder "Abyssal Launcher.app" -ov -format UDZO "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          echo "DMG=$OUT" >> "$GITHUB_ENV"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-output
          path: |
            source/${{ env.DMG }}
            source/${{ env.DMG }}.sha256
          if-no-files-found: error
          retention-days: 7
