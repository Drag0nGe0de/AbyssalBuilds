name: Rust build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the binaries are for (e.g. v13.0.0-rust.2)"
        required: true
      branch:
        description: "Branch of the source repository to build"
        required: false
        default: "rust"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Clone the private source
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${{ secrets.SRC_TOKEN }}@github.com/${{ secrets.SRC_REPO }}.git" source
          cd source
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          java -version 2>&1 | head -1 || true

      - name: Add Apple targets
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Unit tests (core)
        shell: bash
        working-directory: source/rust
        run: cargo test --locked

      - name: Upload golden captures (QA forensics)
        uses: actions/upload-artifact@v4
        with:
          name: golden-captures
          path: source/rust/target/golden/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build (arm64)
        shell: bash
        working-directory: source/rust
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build (x86_64)
        shell: bash
        working-directory: source/rust
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Merge into a universal binary
        shell: bash
        working-directory: source/rust
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/abyssallauncher \
            target/x86_64-apple-darwin/release/abyssallauncher \
            -output abyssallauncher
          lipo -info abyssallauncher

      - name: Compile the launcher java helpers
        shell: bash
        working-directory: source
        run: |
          set -e
          JROOT="$RUNNER_TEMP/javac"
          mkdir -p "$JROOT/check" "$JROOT/newlaunch" "$JROOT/legacy" "$JROOT/legacy_src"
          # release 8 first, fall back to 11 on newer JDKs
          REL="--release 8"
          javac $REL -d "$JROOT/check" libraries/javacheck/JavaCheck.java || REL="--release 11"
          javac $REL -d "$JROOT/check" libraries/javacheck/JavaCheck.java
          # NewLaunch: every non-legacy launcher source
          (cd libraries/launcher && find org -name "*.java") > "$JROOT/newlaunch.srcs"
          sed -i '' 's|^|libraries/launcher/|' "$JROOT/newlaunch.srcs"
          javac $REL -d "$JROOT/newlaunch" @"$JROOT/newlaunch.srcs"
          jar cf "$JROOT/NewLaunch.jar" -C "$JROOT/newlaunch" .
          # NewLaunchLegacy: legacy sources compiled against NewLaunch
          (cd libraries/launcher && find legacy -name "*.java") > "$JROOT/legacy.srcs"
          sed -i '' 's|^|libraries/launcher/|' "$JROOT/legacy.srcs"
          javac $REL -cp "$JROOT/NewLaunch.jar" -d "$JROOT/legacy" @"$JROOT/legacy.srcs"
          # legacy jar = NewLaunch classes + legacy overlay (jar uf overwrites dupes)
          cp "$JROOT/NewLaunch.jar" "$JROOT/NewLaunchLegacy.jar"
          jar uf "$JROOT/NewLaunchLegacy.jar" -C "$JROOT/legacy" .
          jar cf "$JROOT/JavaCheck.jar" -C "$JROOT/check" .
          ls -la "$JROOT" | grep jar

      - name: Bundle the app
        shell: bash
        working-directory: source
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          APP="Abyssal Launcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/jars"
          cp rust/abyssallauncher "$APP/Contents/MacOS/abyssallauncher"
          cp rust/assets/appicon.png "$APP/Contents/Resources/appicon.png"
          cp -r rust/assets/icons "$APP/Contents/Resources/icons"
          cp -r rust/assets/fonts "$APP/Contents/Resources/fonts"
          mkdir -p "$APP/Contents/Resources/instance_icons"
          cp rust/assets/instance_icons/* "$APP/Contents/Resources/instance_icons/" || true
          cp "$RUNNER_TEMP/javac/NewLaunch.jar" "$APP/Contents/Resources/jars/NewLaunch.jar"
          cp "$RUNNER_TEMP/javac/NewLaunchLegacy.jar" "$APP/Contents/Resources/jars/NewLaunchLegacy.jar"
          cp "$RUNNER_TEMP/javac/JavaCheck.jar" "$APP/Contents/Resources/jars/JavaCheck.jar"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Abyssal Launcher</string>
            <key>CFBundleDisplayName</key><string>Abyssal Launcher</string>
            <key>CFBundleIdentifier</key><string>org.abyssallauncher.AbyssalLauncher</string>
            <key>CFBundleExecutable</key><string>abyssallauncher</string>
            <key>CFBundleIconFile</key><string>appicon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          # volume icon for the dmg
          iconutil -c icns --icon "$APP/Contents/Resources/appicon.png" 2>/dev/null || true
          codesign --force --sign - "$APP"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Memory smoke test (launch, sample RSS, quit)
        shell: bash
        working-directory: source
        run: |
          APP="Abyssal Launcher.app"
          # run in a scratch data dir so CI does not touch the real profile
          export ABYSSALLAUNCHER_DATA_DIR="$RUNNER_TEMP/abyssal-data"
          "$APP/Contents/MacOS/abyssallauncher" --version || true
          "$APP/Contents/MacOS/abyssallauncher" &
          APP_PID=$!
          sleep 6
          RSS_KB=$(ps -o rss= -p $APP_PID 2>/dev/null | tail -1 | tr -d ' ')
          echo "RSS_KB=${RSS_KB:-unknown}" >> "$GITHUB_ENV"
          if [ -n "$RSS_KB" ]; then
            echo "RSS_MB=$((RSS_KB / 1024)) MB" >> "$GITHUB_ENV"
          fi
          kill $APP_PID 2>/dev/null || true
          sleep 1
          echo "Launcher RSS: ${RSS_KB:-unknown} KB"

      - name: Zip the app bundle (fast no-mount artifact)
        shell: bash
        working-directory: source
        run: |
          TAG="${{ inputs.tag }}"
          OUT="AbyssalLauncher-${TAG}-macOS-universal.zip"
          ditto -c -k --keepParent "Abyssal Launcher.app" "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          echo "ZIP=$OUT" >> "$GITHUB_ENV"

      - name: Package the dmg (with Applications symlink)
        shell: bash
        working-directory: source
        run: |
          TAG="${{ inputs.tag }}"
          OUT="AbyssalLauncher-Rust-${TAG}-macOS-universal.dmg"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R "Abyssal Launcher.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Abyssal Launcher" -srcfolder "$STAGE" -ov -format UDZO "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          echo "DMG=$OUT" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d' ' -f1 "$OUT.sha256")" >> "$GITHUB_ENV"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-output
          path: |
            source/${{ env.ZIP }}
            source/${{ env.ZIP }}.sha256
            source/${{ env.DMG }}
            source/${{ env.DMG }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        shell: bash
        run: |
          echo "Tag: ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: ${{ secrets.SRC_REPO }} @ ${{ env.SOURCE_SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Universal binary + launcher jars bundled" >> "$GITHUB_STEP_SUMMARY"
          echo "Launcher RSS at startup: ${{ env.RSS_MB || 'not measured' }}" >> "$GITHUB_STEP_SUMMARY"
